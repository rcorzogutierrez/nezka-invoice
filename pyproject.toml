[project]
name = "nezka-invoice"
version = "0.1.0"
description = "Aplicación de escritorio de Elpidio Jr. Produce Co. para gestionar clientes"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pymupdf>=1.24"]

[project.gui-scripts]
nezka-invoice = "nezka_invoice.app:main"

[tool.setuptools]
packages = ["nezka_invoice", "nezka_invoice.ui"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
nezka_invoice = ["assets/*.png", "assets/*.svg", "assets/products/*"]
